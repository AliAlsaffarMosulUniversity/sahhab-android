name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir out
          cd app/build/outputs/apk/release
          cp app-arm64-v8a-release.apk   ../../../../../out/Sahhab-arm64.apk
          cp app-armeabi-v7a-release.apk ../../../../../out/Sahhab-arm32-old-phones.apk
          cp app-x86_64-release.apk      ../../../../../out/Sahhab-x86_64.apk
          cp app-universal-release.apk   ../../../../../out/Sahhab-universal.apk
          ls -la ../../../../../out

      - uses: actions/upload-artifact@v4
        with:
          name: Sahhab-APK
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: سحّاب 1.0.${{ github.run_number }}
          body: |
            ثبّت الملف المناسب لهاتفك:
            - Sahhab-arm64.apk — لأغلب الهواتف الحديثة (اختر هذا أولاً)
            - Sahhab-arm32-old-phones.apk — للهواتف القديمة
            - Sahhab-universal.apk — يعمل على كل الهواتف لكنه أكبر حجماً
          files: out/*.apk
